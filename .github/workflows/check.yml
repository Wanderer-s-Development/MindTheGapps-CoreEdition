name: Build and Release GApps

on:
  push:
    branches:
      - cinnamonbun
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to compile'
        required: true
        default: 'arm64'
        type: choice
        options:
          - 'arm64'
          - 'both'
          - 'arm'
      publish_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Core & Telephony Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-parse python3-requests libarchive-tools

          curl -sSL --output aapt2.jar https://dl.google.com/android/maven2/com/android/tools/build/aapt2/8.12.0-alpha05-12782657/aapt2-8.12.0-alpha05-12782657-linux.jar
          sudo unzip -d /usr/bin aapt2.jar aapt2
          sudo chmod +x /usr/bin/aapt2
          rm -f aapt2.jar

      - name: Compile GApps (Core & Telephony)
        run: |
          TARGET="${{ inputs.arch }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "both" ]; then
            make gapps_arm gapps_arm64
          elif [ "$TARGET" = "arm" ]; then
            make gapps_arm
          else
            make gapps_arm64
          fi

          echo "=== Generated Packages ==="
          ls -lh out/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MindTheGapps-packages
          path: |
            out/*.zip
            out/*.sha256sum

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="MindTheGapps-17.0.0-$(date -u +'%Y%m%d_%H%M%S')"
          RELEASE_TITLE="MindTheGapps 17.0.0 Core & Telephony ($(date -u +'%Y-%m-%d'))"

          cat << 'EOF' > /tmp/release_notes.md
          ## MindTheGapps (Android 17 / API 37)

          Automated build containing two distinct editions published under this release:

          ---

          ### 📦 1. Core Package (`...-Core-...zip`)
          Minimal clean Google experience without replacing stock ROM communication apps:
          * **Google Play Services** (APEX mainline container `com.google.android.gmssystem.prodvic.apex`)
          * **Google Play Store** (`Phonesky`)
          * **Google Services Framework** (`GoogleServicesFramework`)
          * **Google Setup Wizard** (`SetupWizard` in `system_ext`)
          * **Google Calendar Sync Adapter** (`GoogleCalendarSyncAdapter`)
          * **Google Contacts Sync Adapter** (`GoogleContactsSyncAdapter`)
          * **Account Transfer & Cloud Restore** (`GoogleRestore`, `GooglePartnerSetup`)
          * 🛡️ **Stock AOSP Dialer, Messaging, and Contacts remain intact.**

          ---

          ### 📞 2. Telephony Package (`...-Telephony-...zip`)
          Everything in Core plus official Google Pixel telephony suite:
          * **All components from Core Package above**
          * **Google Phone / Dialer** (`GoogleDialer` with In-Call UI & Call Recording support)
          * **Google Messages** (`PrebuiltBugle` with native Jibe RCS support)
          * **Google Contacts** (`GoogleContacts` full app)
          * 🔄 **Automated recovery cleanup of stock AOSP Dialer, Messaging, and Contacts.**

          ---

          ### 🚫 De-bloated / Excluded from Both Editions:
          * ❌ `Velvet` / `VelvetTitan` (Google Search App) completely stripped.
          * ❌ `SpeechServicesByGoogle` (TTS), `GoogleFeedback`, `TalkBack`, `FamilyLink`, `Wellbeing`, `AndroidAutoStub`.
          EOF

          echo "Publishing release $TAG_NAME with all Core and Telephony assets..."
          gh release create "$TAG_NAME" \
            out/*.zip \
            out/*.sha256sum \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md
