name: Build and Release GApps

on:
  push:
    branches:
      - cinnamonbun
  pull_request:
    branches:
      - cinnamonbun
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to compile'
        required: true
        default: 'arm64'
        type: choice
        options:
          - 'arm64'
          - 'both'
          - 'arm'
      publish_release:
        description: 'Publish as GitHub Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install python3-parse python3-requests libarchive-tools

          curl -sSL --output aapt2.jar https://dl.google.com/android/maven2/com/android/tools/build/aapt2/8.12.0-alpha05-12782657/aapt2-8.12.0-alpha05-12782657-linux.jar
          sudo unzip -d /usr/bin aapt2.jar aapt2
          sudo chmod +x /usr/bin/aapt2
          rm -f aapt2.jar

      - name: Compile GApps packages
        run: |
          TARGET="${{ inputs.arch }}"
          if [ -z "$TARGET" ] || [ "$TARGET" = "both" ]; then
            make gapps_arm gapps_arm64
          elif [ "$TARGET" = "arm" ]; then
            make gapps_arm
          else
            make gapps_arm64
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MindTheGapps-packages
          path: |
            out/*.zip
            out/*.zip.sha256sum

      - name: Publish GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="MindTheGapps-17.0.0-$(date -u +'%Y%m%d_%H%M%S')"
          RELEASE_TITLE="MindTheGapps Minimal 17.0.0 ($(date -u +'%Y-%m-%d'))"

          cat << 'EOF' > /tmp/release_notes.md
          ## MindTheGapps Minimal (Android 17 / API 37)

          Personal build of MindTheGapps featuring official Google Pixel telephony apps extracted from Google's official Pixel 8 OTA.

          ### Included Components:
          - **Google Play Services** (APEX mainline container `com.google.android.gmssystem.prodvic.apex`)
          - **Google Play Store** (`Phonesky`)
          - **Google Setup Wizard** (`SetupWizard` in `system_ext`)
          - **Google Dialer** (`GoogleDialer` with In-Call UI and Call Recording)
          - **Google Messages** (`PrebuiltBugle` with native Jibe RCS support)
          - **Google Contacts** (`GoogleContacts`)
          - **Cloud Restore & Account Transfer** (`GoogleRestore`, `GooglePartnerSetup`)

          ### De-bloated / Removed:
          - Removed `SpeechServicesByGoogle` (TTS), `GoogleFeedback`, `TalkBack`, `FamilyLink`, `Wellbeing`, `PrebuiltExchange3Google`, and `AndroidAutoStub`.
          - Automated recovery cleanup of stock AOSP Dialer, Messages, and Contacts upon flashing.

          ---
          *Note: This is a personal project build for Android 17 / VoltageOS.*
          EOF

          echo "Publishing release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            out/*.zip \
            out/*.zip.sha256sum \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md
